<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tikus&quot;,&quot;bebek&quot;,&quot;kumbang&quot;,&quot;lele&quot;,&quot;kelinci&quot;,&quot;lebah&quot;,&quot;angsa&quot;],&quot;default&quot;:&quot;tikus&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;flip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;still&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {}, k = p.kind || 'tikus', still = !!p.still;
    const v = {
      flipTf: p.flip ? 'scaleX(-1)' : 'none',
      aBob: still ? 'none' : k === 'kumbang' ? 'msSag 3.2s ease-in-out infinite' : 'msBob 2.2s ease-in-out infinite',
      aWingL: still ? 'none' : 'msWingL .25s ease-in-out infinite',
      aWingR: still ? 'none' : 'msWingR .25s ease-in-out infinite'
    };
    ['tikus', 'bebek', 'kumbang', 'lele', 'kelinci', 'lebah', 'angsa'].forEach(n => { v['d_' + n] = n === k ? 'inline' : 'none'; });
    return v;
  }
}
</script>
